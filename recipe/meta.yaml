{% set name = "aimz" %}
{% set version = "0.18.0" %}
{% set python_min = 3.12 %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/aimz-{{ version }}.tar.gz
  sha256: 532b74ceffaaa2d5cc52074b258ebb82d7b341cde2e2b9f20452cfc1a01dc9fe

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - dask-core >=2026.1
    - jax >=0.10
    - numpyro >=0.22
    - psutil >=7
    - xarray >=2026.1
    - zarr >=3.2

test:
  imports:
    - aimz
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/aimz/
  summary: Scalable probabilistic impact modeling
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - markean
